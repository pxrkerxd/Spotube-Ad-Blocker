<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ad Blocker</title>
    <style>
        body {
            width: 200px;
            font-family: system-ui, sans-serif;
            padding: 1rem;
            margin: 0;
            background: #14181e;
            color: #fff;
            text-align: center;
        }
        h3 { margin-bottom: 0.5rem; font-size: 1rem; }
        p { font-size: 0.8rem; opacity: 0.7; margin: 0; }
        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 10px;
            background: rgba(92, 194, 170, 0.2);
            color: #5cc2aa;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h3>SimpleAdBlocker</h3>
    <p>Protecting your browsing session</p>
    <div class="status">● Active</div>
</body>
</html>
